<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annotation Complete</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #27ae60;
            margin-bottom: 20px;
        }

        .stats {
            margin: 30px 0;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: bold;
            color: #2c3e50;
        }

        .file-path {
            font-family: monospace;
            font-size: 12px;
            color: #999;
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            margin-top: 20px;
            word-break: break-all;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background-color: #5dade2;
        }

        .btn-secondary {
            background-color: transparent;
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }

        .btn-secondary:hover {
            background-color: #fdf2f2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Annotation Complete!</h1>
        <p>You have annotated all papers.</p>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Total annotated:</span>
                <span class="stat-value">{{ total }}</span>
            </div>
        </div>

        <div class="file-path">
            {{ annotations_file }}
        </div>

        <div class="actions">
            <a href="/stats" class="btn btn-primary" target="_blank">View Stats</a>
            <a href="/reset" class="btn btn-secondary" onclick="return confirm('This will clear all annotations. Are you sure?')">Reset & Start Over</a>
        </div>
    </div>
</body>
</html>
